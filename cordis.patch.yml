# dsh-agent-chat bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published package: when the
# plugin is installed through the official CLI —
#
#   dsh plugin --profile <name> add dsh-agent-chat@<version>
#
# — the command reconciles `dsh.profile.bundles` against installed packages and,
# seeing this declaration, appends `dsh-agent-chat` to the bundle stack. Profile
# boot then merges THIS patch (a single `insert` of the plugin row) exactly like
# a manual cordis.patch.yml mount line. No profile file edits needed.
#
# The plugin id is the package name, so the loader entry and the npm package
# line up one-to-one. Change one, change both.
- insert:
    - id: dsh-agent-chat
      name: 'dsh-agent-chat'
